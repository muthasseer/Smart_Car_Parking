
name: Android APK Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Repository root-la ZIP file kidaikkala."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android-project"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/android-project" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: ZIP-la settings.gradle file kidaikkala."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager kidaikkala."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          COMPILE_SDK="$(grep -RhoE \
            'compileSdk(Version)?[[:space:]]*(=)?[[:space:]]*[0-9]+' \
            "$PROJECT_ROOT" \
            --include='build.gradle' \
            --include='build.gradle.kts' \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            | grep -oE '[0-9]+' | head -n1 || true)"

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK=35
            echo "compileSdk detect panna mudiyala; Android 35 use pannrom."
          fi

          echo "Using Android platform: $COMPILE_SDK"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ ! -f gradlew ]; then
            echo "ERROR: Project-la gradlew wrapper file kidaikkala."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: |
            ${{ env.PROJECT_ROOT }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
